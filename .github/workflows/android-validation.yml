name: Android validation

on:
  push:
    branches:
      - ci/test-compilation-feedback
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.4'
          cache-provider: enhanced
          cache-read-only: false

      - name: Run unit tests, lint and builds
        run: gradle --build-cache --parallel testDebugUnitTest lintDebug assembleDebug assembleRelease
